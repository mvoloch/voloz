<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16">
  <title>Voloz</title>
  <!-- voice bars: 2 units wide, 1 unit apart, centred on y=8 -->
  <g fill="#16181D">
    <rect x="1" y="6" width="2" height="4" rx="1"/>
    <rect x="4" y="3" width="2" height="10" rx="1"/>
    <rect x="7" y="5" width="2" height="6" rx="1"/>
  </g>
  <!-- text caret (I-beam), as tall as the wordmark's ascender -->
  <g fill="#4D7C0F">
    <rect x="12" y="2" width="2" height="12"/>
    <rect x="11" y="2" width="4" height="1"/>
    <rect x="11" y="13" width="4" height="1"/>
  </g>
</svg>
